<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b" />
      <stop offset="50%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#020617" />
    </linearGradient>
    <linearGradient id="mic-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg-grad)" />
  
  <!-- Accent Rings -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 10" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.1" />

  <!-- Microphone Icon Group -->
  <g transform="translate(256, 210) scale(10)">
    <g transform="translate(-12, -12)">
      <!-- Mic Head -->
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" fill="url(#mic-body)" stroke="#e11d48" stroke-width="0.5" />
      <!-- Mic Body Grille -->
      <path d="M9 5h6M9 7.5h6M9 10h6" stroke="#0f172a" stroke-width="0.2" stroke-opacity="0.5" />
      
      <!-- Stand -->
      <path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke="white" stroke-width="1.2" stroke-linecap="round" />
      <line x1="12" y1="19" x2="12" y2="22" stroke="white" stroke-width="1.2" stroke-linecap="round" />
      <line x1="8" y1="22" x2="16" y2="22" stroke="white" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Text Branding -->
  <g transform="translate(256, 400)">
    <text text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-1" filter="url(#glow)">
      <tspan fill="white">FREE STATE </tspan>
      <tspan fill="#e11d48">FM</tspan>
    </text>
    <rect x="-80" y="20" width="160" height="4" fill="url(#bg-grad)" rx="2" />
    <rect x="-80" y="20" width="40" height="4" fill="#e11d48" rx="2" />
  </g>
  
  <!-- Subtle Shine -->
  <path d="M100 100 Q 256 50 412 100" fill="none" stroke="white" stroke-width="30" stroke-opacity="0.05" stroke-linecap="round" />
</svg>
